<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Murder in the Mafia Audio Companion</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1a1a1a">
</head>
<body>
    <div class="app-container">
        <header>
            <img src="images/head.png" alt="Escape The Room: Murder in the Mafia" class="header-logo">
        </header>

        <main id="game-card" class="round-card">
            <div class="round-info">
                <h1 id="title">Завантаження...</h1>
                <h2 id="subtitle"></h2>
            </div>
            
            <div class="controls">
                <button id="prev-btn" class="nav-button">←</button>
                <button id="next-btn" class="nav-button">→</button>
            </div>

            <div class="player-container">
                <audio id="audio-player" controls preload="auto">
                    <source id="audio-source" src="" type="audio/mpeg">
                    Ваш браузер не підтримує аудіо елемент.
                </audio>
            </div>
        </main>

        <footer>
            <div class="footer-buttons">
                <a href="https://legacy.thinkfun.com/escapetheroom/mafia/hints/" target="_blank" class="help-link">Допомога</a>
                <button id="share-btn" class="share-button">
                    <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor"><path d="M18 16.08c-.76 0-1.44.3-1.96.77L8.91 12.7c.05-.23.09-.46.09-.7s-.04-.47-.09-.7l7.05-4.11c.54.5 1.25.81 2.04.81 1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3c0 .24.04.47.09.7L8.04 9.81C7.5 9.31 6.79 9 6 9c-1.66 0-3 1.34-3 3s1.34 3 3 3c.79 0 1.5-.31 2.04-.81l7.12 4.16c-.05.21-.08.43-.08.65 0 1.61 1.31 2.92 2.92 2.92s2.92-1.31 2.92-2.92c0-1.61-1.31-2.92-2.92-2.92zM18 4c.55 0 1 .45 1 1s-.45 1-1 1-1-.45-1-1 .45-1 1-1zM6 13c-.55 0-1-.45-1-1s.45-1-1-1 1 .45 1 1-.45 1-1 1zm12 7.02c-.55 0-1-.45-1-1s.45-1-1-1 1 .45 1 1-.45 1-1 1z"/></svg>
                </button>
            </div>
        </footer>
    </div>

    <audio id="sfx-player" preload="auto" style="display: none;">
        <source src="audio/page-flip.mp3" type="audio/mpeg">
    </audio>

    <script src="script.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js');
        }
    </script>
</body>
</html>
